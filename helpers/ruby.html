<!DOCTYPE html>

<head>
	<title>helpful little conlang helper</title>
	<style>
		body,
		textarea {
			font-family: jetbrains mono;
		}

		textarea {
			width: 80%;
		}

		#ruby-output,
		#tt-output,
		#words li {
			user-select: all;
		}
	</style>
</head>

<body>
	<h1>ruby generator!</h1>
	<textarea id="ruby-input"></textarea>
	<p id="ruby-output"></p>

	<h1>tooltip generator!</h1>
	<textarea id="tt-input"></textarea>
	<p id="tt-output"></p>

	<h1>word generator!</h1>
	<button onclick="genwords()">generate!</button>
	<ul id="words"></ul>
	<script>
		const vow = { a: 'ㄚ', e: 'ㄜ', i: 'ㄧ', o: 'ㄛ', u: 'ㄨ' }
		const con = {
			b: 'ㄅ',
			p: 'ㄆ',
			d: 'ㄉ',
			t: 'ㄊ',
			g: 'ㄍ',
			k: 'ㄎ',
			v: 'ㄏ',
			f: 'ㄈ',
			m: 'ㄇ',
			n: 'ㄋ',
			y: 'ㄦ',
			w: 'ㄩ',
			l: 'ㄌ',
			j: 'ㄐ',
			q: 'ㄑ',
			x: 'ㄒ',
			z: 'ㄗ',
			c: 'ㄘ',
			s: 'ㄙ',
			zh: 'ㄓ',
			ch: 'ㄔ',
			sh: 'ㄕ',
		};
		const v = Object.keys(vow);
		const c = Object.keys(con);

		const rubyInput = document.getElementById('ruby-input');
		const rubyOutput = document.getElementById('ruby-output');
		rubyInput.addEventListener('change', e => {
			let inRuby = false;
			let inRT = false;
			let result = '';
			for (let z = 0; z < rubyInput.value.length; z++) {
				let letter = rubyInput.value[z];
				// controls
				if (letter == '[') {
					inRuby = true;
					inRT = false;
					result += '<ruby>';
					continue;
				}
				if (letter == ']') {
					inRuby = false;
					inRT = false;
					result += '</rt></ruby>';
					continue;
				}
				if (letter == '/') {
					if (inRT) {
						inRT = false;
						result += '</rt>'
					} else {
						inRT = true;
						result += '<rt>'
					}
					continue;
				}
				// punctuation
				if (letter == "'") {
					result += '＇';
					continue;
				}
				if (letter == ' ') {
					result += '　';
					continue;
				}
				if (letter == '-') {
					result += '·';
					continue;
				}
				if (letter == ',' && rubyInput.value[z + 1] == ' ') {
					result += '，';
					z++;
					continue;
				}
				// actual letters
				if (v.includes(letter)) {
					result += vow[letter];
					continue;
				}
				if (c.includes(letter)) {
					result += con[letter];
					continue;
				}
				result += letter;
			}
			rubyOutput.innerText = result;
		});

		const ttInput = document.getElementById('tt-input');
		const ttOutput = document.getElementById('tt-output');
		ttInput.addEventListener('change', e => {
			ttOutput.innerText = ttInput.value.replace(
				/\[([^/]+)\/([^\]]+)\]/g,
				'<span class="tooltip"><span class="tooltip-text">$2</span>$1</span>'
			);
		});

		const wordList = document.getElementById('words');
		function genwords() {
			wordList.innerHTML = '';
			for (let z = 0; z < 50; z++) {
				const length = Math.floor(Math.random() * 4) + 1;
				let word = "";
				for (let i = 0; i < length; i++) {
					const kind = Math.floor(Math.random() * 9) + 1;
					if (kind === 1) {
						word += v[Math.floor(Math.random() * v.length)];
					} else if (kind === 2 || kind === 3 || kind === 4) {
						word += c[Math.floor(Math.random() * c.length)];
						word += v[Math.floor(Math.random() * v.length)];
					} else if (kind === 5 || kind === 6) {
						word += v[Math.floor(Math.random() * v.length)];
						let letter = c[Math.floor(Math.random() * c.length)];
						while (["y", "w", "l"].includes(letter)) {
							letter = c[Math.floor(Math.random() * c.length)];
						}
						word += letter;
					} else {
						word += c[Math.floor(Math.random() * c.length)];
						word += v[Math.floor(Math.random() * v.length)];
						let letter = c[Math.floor(Math.random() * c.length)];
						while (["y", "w", "l"].includes(letter)) {
							letter = c[Math.floor(Math.random() * c.length)];
						}
						word += letter;
					}
					if (i !== length - 1) {
						word += "'";
					}
				}
				wordList.innerHTML += `<li>${word}</li>`;
			}
		}
	</script>
</body>
