	<style>
		html {
			height: 100%;
		}

		body {
			margin: 0;
			height: 100%;
			width: 100%;
			font-size: clamp(1rem, 0.8929rem + 0.5357vw, 1.375rem);
		}

		#stars {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -99;
			background-image: radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px),
				radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px),
				radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px),
				radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px),
				radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px),
				radial-gradient(white 1px, transparent 2px),
				radial-gradient(white 1px, transparent 0px);
			background-size: 135px 135px, 352px 352px, 213px 213px, 210px 210px, 272px 272px, 128px 128px, 266px 266px, 388px 388px, 126px 126px, 349px 349px, 345px 345px, 399px 399px;
			background-position: 385px 228px, 126px 279px, 247px 259px, 370px 153px, 186px 269px, 225px 293px, 238px 371px, 379px 306px, 328px 397px, 243px 291px, 246px 287px, 313px 123px;
		}

		#sun,
		#moon {
			inset: 0;
			position: fixed;
		}

		#sun {
			z-index: 2;

			div {
				width: 6em;
				height: 6em;
				background-color: #fff;
				border-radius: 999px;
				position: fixed;
				transform: translate(-50%, -50%) translateY(-40vmin);
				top: 50%;
				left: 50%;
			}
		}

		#moon {
			z-index: 3;

			div {
				width: 5em;
				height: 5em;
				background-color: #000;
				border-radius: 999px;
				position: fixed;
				transform: translate(-50%, -50%) translateY(-40vmin);
				top: 50%;
				left: 50%;
			}
		}

		#island img {
			position: fixed;
			width: 80vmin;
			height: 80vmin;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			filter: drop-shadow(0 0 6px white);
			animation: float 5s infinite ease-in-out;
			z-index: 100;
		}

		@keyframes float {
			0% {
				transform: translate(-50%, -50%) translateY(-1em);
			}

			50% {
				transform: translate(-50%, -50%) translateY(1em);
			}

			100% {
				transform: translate(-50%, -50%) translateY(-1em);
			}
		}
	</style>

			<div></div>
		</div>

			<div></div>

	</main>
	<script>
		let nextTickTime = 0;
		let timer = null;

		const starsDiv = document.getElementById('stars');
		const sunDiv = document.getElementById('sun');
		const moonDiv = document.getElementById('moon');
		const islands = document.querySelectorAll('#island img');

		const colors = {
			sunrise: ["oklch(0.5638 0.1762 16.02)", "oklch(0.7823 0.1318 41.85)", "oklch(0.9001 0.1548 94.52)"],
			day: ["oklch(0.6647 0.1855 0.53)", "oklch(0.8131 0.1263 88.66)", "oklch(0.728163 0.153367 243.1184)"],
			evening: ["oklch(0.4807 0.151 320.47)", "oklch(0.5786 0.1669 25.64)", "oklch(0.9001 0.1548 94.52)"],
			twilight: ["oklch(0.1809 0.1092 279.35)", "oklch(0.3457 0.1394 302.85)", "oklch(0.6573 0.1548 354.12)"],
			night: ["oklch(0 0 0)", "oklch(0.1809 0.1092 279.35)", "oklch(0.728163 0.153367 243.1184)"]
		};
		const colorTime = [
			{ time: 0, color: colors.night },
			{ time: 3 * 60, color: colors.night },
			{ time: 5 * 60, color: colors.sunrise },
			{ time: 10 * 60, color: colors.day },
			{ time: 14 * 60, color: colors.day },
			{ time: 19 * 60, color: colors.evening },
			{ time: 22 * 60, color: colors.twilight },
			{ time: 24 * 60, color: colors.night }
		];

		function startOrrery() {
			let now = new Date();
			let nextMin = new Date(now);
			nextMin.setMinutes(now.getMinutes() + 1, 0, 0);
			nextTickTime = nextMin.getTime();
			updateOrrery(now);
			checkTime();
		}

		function checkTime() {
			let currentTime = Date.now();
			if (currentTime >= nextTickTime) {
				let now = new Date(currentTime);
				updateOrrery(now);
				// 1 min
				nextTickTime += 1 * 60 * 1000;
			}
			// we need to check often bc browsers pause setIntervals/timeouts when tab unfocused
			timer = setTimeout(checkTime, 100);
		}

		function updateOrrery(dateObj) {
			let minutes = (dateObj.getHours() * 60) + dateObj.getMinutes();
			// bg
			updateBackground(minutes);
			updateStars(minutes);
			// sun
			let sunAngle = 360 * (minutes / (24 * 60)) + 180;
			sunDiv.style.transform = `rotate(${sunAngle}deg)`;
			// moon
			updateMoon(dateObj, sunAngle);
		}
		function updateMoon(dateObj, sunAngle) {
			if (dateObj.getMonth() == 0 && dateObj.getDate() == 23) { // eclipse day
				moonDiv.style.transform = `rotate(${sunAngle}deg)`;
				return;
			}
			// get last jan 23
			let lastNYYear = dateObj.getFullYear();
			let today = utc(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
			let lastNewYear = utc(dateObj.getFullYear(), 0, 23);
			// if today isnt jan 23 yet, use last years
			if (today < lastNewYear) {
				lastNewYear = utc(dateObj.getFullYear() - 1, 0, 23);
				lastNYYear = dateObj.getFullYear() - 1;
			}
			// days since last new year
			let diff = (today - lastNewYear) / 1000 / 60 / 60 / 24;
			// we need to account for the fucking leap years
			let lastYear = utc(lastNYYear, 0, 23);
			let nextYear = utc(lastNYYear + 1, 0, 23);
			let yearLength = (nextYear - lastYear) / 1000 / 60 / 60 / 24;
			console.assert(yearLength == 365 || yearLength == 366);
			let offset = 360 * (diff / yearLength);
			moonDiv.style.transform = `rotate(${sunAngle + offset}deg)`;
		}
		function utc(y, m, d) {
			return Date.UTC(y, m, d);
		}
		function updateStars(m) {
			let opacity;
			if (m > 7 * 60 && m < 18 * 60) // day
				opacity = 0;
			else if (m < 4 * 60 || m > 22 * 60) // night
				opacity = 1;
			else if (m <= 7 * 60) // dawn
				opacity = 1 - (m - 4 * 60) / (3 * 60);
			else // sunset
				opacity = (m - 18 * 60) / (5 * 60);
			starsDiv.style.opacity = opacity;
		}
		function updateBackground(m) {
			for (let i = 0; i < colorTime.length - 1; i++) {
				if (m == colorTime[i].time) {
					document.body.style.background = `linear-gradient(${colorTime[i].color[0]}, ${colorTime[i].color[1]})`;
					return;
				}
				if (m > colorTime[i].time && m < colorTime[i + 1].time) {
					let a = colorTime[i];
					let b = colorTime[i + 1];
					let t = (m - a.time) / (b.time - a.time);
					const topColor = interpolateColor(a.color[0], b.color[0], t);
					const bottomColor = interpolateColor(a.color[1], b.color[1], t);
					const shadowColor = interpolateColor(a.color[2], b.color[2], t);
					document.body.style.background = `linear-gradient(${topColor}, ${bottomColor})`;
					for (let img of islands) img.style.filter = `drop-shadow(0 0 6px ${shadowColor})`;
				}
			}
		}
		// parse into [l, c, h]
		function parseOKLCH(color) {
			let match = color.match(/oklch\(\s*([\d.]+)\s+([\d.]+)\s+([\d.]+)\s*\)/);
			if (!match) throw new Error("wrogn oklch: " + color);
			return match.slice(1).map(Number);
		}
		// interpolate two oklch colors
		function interpolateColor(a, b, t) {
			let a2 = parseOKLCH(a);
			let b2 = parseOKLCH(b);
			// go the short hue route
			let hueDiff = b2[2] - a2[2];
			if (hueDiff > 180) hueDiff -= 360;
			if (hueDiff < -180) hueDiff += 360;
			let l = a2[0] + (b2[0] - a2[0]) * t;
			let c = a2[1] + (b2[1] - a2[1]) * t;
			let h = (a2[2] + hueDiff * t + 360) % 360;
			return `oklch(${l} ${c} ${h})`;
		}

		startOrrery();
	</script>
