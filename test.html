<!DOCTYPE html>
<html>

<head>
	<style>
		main {
			display: flex;
			width: 100%;
			height: auto;
		}

		main div {
			flex: 1;
			aspect-ratio: 1;
		}

		#sunrise {
			background: linear-gradient(oklch(0.5638 0.1762 16.02), oklch(0.7823 0.1318 41.85));
		}

		#day {
			background: linear-gradient(oklch(0.6647 0.1855 0.53), oklch(0.8131 0.1263 88.66));
		}

		#evening {
			background: linear-gradient(oklch(0.4807 0.151 320.47), oklch(0.5786 0.1669 25.64));
		}

		#twilight {
			background: linear-gradient(oklch(0.1809 0.1092 279.35), oklch(0.3457 0.1394 302.85));
		}

		#night {
			background: linear-gradient(oklch(0 0 0), oklch(0.1809 0.1092 279.35));
		}

		#top,
		#bottom {
			width: 100%;
			height: 50px;
		}

		#top {
			background: linear-gradient(to right,
					oklch(0.5638 0.1762 16.02), oklch(0.6647 0.1855 0.53),
					oklch(0.4807 0.151 320.47), oklch(0.1809 0.1092 279.35),
					oklch(0 0 0), oklch(0.5638 0.1762 16.02));
		}

		#bottom {
			background: linear-gradient(to right,
					oklch(0.7823 0.1318 41.85), oklch(0.8131 0.1263 88.66),
					oklch(0.5786 0.1669 25.64), oklch(0.3457 0.1394 302.85),
					oklch(0.1809 0.1092 279.35), oklch(0.7823 0.1318 41.85));
		}

		#preview {
			width: 200px;
			height: 200px;
		}

		#time-control {
			margin-top: 20px;
		}

		#time-slider {
			width: 100%;
		}

		#time-label {
			margin-bottom: 8px;
		}
	</style>
</head>

<body>
	<main>
		<div id="sunrise"></div>
		<div id="day"></div>
		<div id="evening"></div>
		<div id="twilight"></div>
		<div id="night"></div>
	</main>
	<div id="top"></div>
	<div id="bottom"></div>

	<div id="preview"></div>
	<div id="time-control">
		<div id="time-label">Time: <span id="time-value">12:00</span></div>
		<input id="time-slider" type="range" min="0" max="1440" value="720" step="1">
	</div>

	<script>
		const slider = document.getElementById("time-slider");
		const timeValue = document.getElementById("time-value");
		const preview = document.getElementById("preview");

		// Colors: [top, bottom] for each phase.
		const colors = {
			sunrise: ["oklch(0.5638 0.1762 16.02)", "oklch(0.7823 0.1318 41.85)"],
			day: ["oklch(0.6647 0.1855 0.53)", "oklch(0.8131 0.1263 88.66)"],
			evening: ["oklch(0.4807 0.151 320.47)", "oklch(0.5786 0.1669 25.64)"],
			twilight: ["oklch(0.1809 0.1092 279.35)", "oklch(0.3457 0.1394 302.85)"],
			night: ["oklch(0 0 0)", "oklch(0.1809 0.1092 279.35)"]
		};

		const keyframes = [
			{ time: 0, color: colors.night },
			{ time: 3 * 60, color: colors.night },
			{ time: 5 * 60, color: colors.sunrise },
			{ time: 10 * 60, color: colors.day },
			{ time: 16 * 60, color: colors.day },
			{ time: 19 * 60, color: colors.evening },
			{ time: 22 * 60, color: colors.twilight },
			{ time: 24 * 60, color: colors.night }
		];

		// Parse "oklch(L C H)" into [L, C, H] numbers.
		function parseOKLCH(color) {
			const match = color.match(/oklch\(\s*([\d.]+)\s+([\d.]+)\s+([\d.]+)\s*\)/);
			if (!match) throw new Error("Bad oklch: " + color);
			return match.slice(1).map(Number);
		}

		// Interpolate two OKLCH colors, shortest hue path.
		function interpolateColor(a, b, t) {
			const A = parseOKLCH(a);
			const B = parseOKLCH(b);

			let hueDiff = B[2] - A[2];
			if (hueDiff > 180) hueDiff -= 360;
			if (hueDiff < -180) hueDiff += 360;

			const L = A[0] + (B[0] - A[0]) * t;
			const C = A[1] + (B[1] - A[1]) * t;
			const H = (A[2] + hueDiff * t + 360) % 360;

			return `oklch(${L} ${C} ${H})`;
		}

		function update() {
			// Slider value is minutes since midnight (0..1440).
			const minutes = Number(slider.value);

			// Display, handling the 1440 edge (24:00).
			const displayH = Math.floor(minutes / 60) % 24;
			const displayM = minutes % 60;
			timeValue.textContent =
				String(displayH).padStart(2, "0") + ":" +
				String(displayM).padStart(2, "0");

			// Find the bracketing keyframe pair.
			for (let i = 0; i < keyframes.length - 1; i++) {
				if (minutes == keyframes[i].time) {
					preview.style.background = `linear-gradient(${keyframes[i].color[0]}, ${keyframes[i].color[1]})`;
					return;
				}
				if (minutes > keyframes[i].time && minutes < keyframes[i + 1].time) {
					a = keyframes[i];
					b = keyframes[i + 1];
					let t = (minutes - a.time) / (b.time - a.time);
					const topColor = interpolateColor(a.color[0], b.color[0], t);
					const bottomColor = interpolateColor(a.color[1], b.color[1], t);
					preview.style.background = `linear-gradient(${topColor}, ${bottomColor})`;
				}
			}
		}
		slider.addEventListener("input", update);
		update();
	</script>
</body>

</html>
